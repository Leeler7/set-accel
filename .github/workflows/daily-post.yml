name: Daily post

# GitHub's scheduled runners are best-effort and can be delayed or skipped
# under load, so this fires twice. The second run is a harmless no-op whenever
# the first one succeeded, because publish.py only ever picks up posts still
# marked pending. Same mechanism recovers a day missed entirely.
on:
  schedule:
    - cron: "30 11 * * *"   # 07:30 America/New_York during EDT
    - cron: "30 15 * * *"   # safety net four hours later
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and print the post without publishing"
        type: boolean
        default: false
      force_date:
        description: "Pretend today is this date (YYYY-MM-DD)"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet pillow

      - name: Validate the queue
        run: python3 tools/validate.py

      - name: Publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          FORCE_DATE: ${{ inputs.force_date }}
        run: python3 tools/publish.py

      - name: Commit the updated queue and log
        if: ${{ !inputs.dry_run }}
        run: |
          if [[ -z "$(git status --porcelain queue posted)" ]]; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "set.accel bot"
          git config user.email "actions@github.com"
          git add queue posted
          git commit -m "posted $(date -u +%Y-%m-%d)"
          # The scheduled run and a manual run can collide; rebase rather than fail.
          git pull --rebase --autostash
          git push
